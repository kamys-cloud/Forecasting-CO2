release: "1.0.0"
data:
  source: "EPA Clean Air Markets Program Data (CAMPD), daily facility-level emissions, 2019-01-01 to 2025-12-31"
  target: "co2_mass (short tons), sum over facilities by state and day; days without a reporting facility are absent, never zero"
  states: ["AL", "AR", "AZ", "CA", "CO", "CT", "DE", "FL", "GA", "IA", "IL", "IN", "KS", "KY", "LA", "MA", "MD", "MI", "MN", "MO", "MS", "MT", "NC", "ND", "NE", "NH", "NJ", "NM", "NV", "NY", "OH", "OK", "OR", "PA", "RI", "SC", "SD", "TN", "TX", "UT", "VA", "WA", "WI", "WV", "WY"]
  excluded_codes:
    AK: "insufficient qualifying facility coverage"
    DC: "insufficient qualifying facility coverage"
    PR: "insufficient qualifying facility coverage"
    ID: "completeness below 98%"
    VT: "completeness below 98% and gap above 14 days"
    ME: "mean daily CO2 below 5,000 short tons"
  eligibility:
    min_observed_share: 0.98
    min_facilities: 5
    min_mean_daily_co2_short_tons: 5000
    min_cv: 0.05
    max_consecutive_missing_days: 14
    duplicates_removed: "state-facility-date duplicates at annual-export boundaries"
  facility_panels:
    balanced: "facilities reporting CO2 in all seven years"
    highcov: "facilities reporting CO2 on >= 95% of days"
    filled: "partial facility-days (load or heat input without CO2) and isolated one-day gaps filled at the facility's own emission factor"
protocol:
  horizons: [1, 2, 3, 5, 7, 10, 14]
  first_origin: "2022-07-17"
  last_target: "2025-12-31"
  refit_every_days: 14
  training: "all rows whose outcome date is on or before the refit date (outcome-availability restriction)"
  validation_block: "last 15% (minimum 20) of eligible rows before the first origin; hyperparameters frozen afterwards"
  selection_criterion: "validation R2"
  threads_per_fit: 1
  random_state: 42
models:
  ridge:
    alpha_grid: [0.1, 0.3, 1, 3, 10, 30, 50, 100, 200, 300, 500, 1000]
    scaling: "standardize"
  gam:
    basis: "cubic B-spline, 5 knots per standardized predictor, no intercept column"
    ridge_alpha_grid: [0.1, 0.3, 1, 3, 10, 30, 50, 100, 200, 300, 500, 1000]
  hgb:
    grid:
      - {"learning_rate": 0.03, "max_depth": 2, "max_iter": 100, "min_samples_leaf": 10}
      - {"learning_rate": 0.03, "max_depth": 3, "max_iter": 150, "min_samples_leaf": 14}
      - {"learning_rate": 0.03, "max_depth": 4, "max_iter": 150, "min_samples_leaf": 20}
      - {"learning_rate": 0.06, "max_depth": 2, "max_iter": 80, "min_samples_leaf": 10}
      - {"learning_rate": 0.06, "max_depth": 3, "max_iter": 120, "min_samples_leaf": 14}
      - {"learning_rate": 0.06, "max_depth": 4, "max_iter": 120, "min_samples_leaf": 20}
      - {"learning_rate": 0.06, "max_depth": 5, "max_iter": 100, "min_samples_leaf": 25}
      - {"learning_rate": 0.1, "max_depth": 2, "max_iter": 80, "min_samples_leaf": 10}
      - {"learning_rate": 0.1, "max_depth": 3, "max_iter": 100, "min_samples_leaf": 14}
      - {"learning_rate": 0.1, "max_depth": 4, "max_iter": 80, "min_samples_leaf": 20}
      - {"learning_rate": 0.15, "max_depth": 3, "max_iter": 80, "min_samples_leaf": 14}
      - {"learning_rate": 0.15, "max_depth": 4, "max_iter": 60, "min_samples_leaf": 25}
